<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coș de cumpărături | Lumina Cu Tine</title>
  <meta name="description" content="Revizuieți coșul de cumpărături Lumina Cu Tine și treceți la checkout-ul Stripe sigur.">
  <meta name="robots" content="noindex,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="cart">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" class="cart-page">
    <section class="page-heading">
      <p class="eyebrow">Coș de cumpărături</p>
      <h1>Piesele tale selectate.</h1>
    </section>
    <section class="cart-page__layout">
      <div id="cart-page-items" class="cart-list"></div>
      <aside class="cart-summary" aria-label="Rezumat coș">
        <h2>Rezumat comandă</h2>
        <div class="summary-row"><span>Subtotal</span><strong data-cart-subtotal>$0.00</strong></div>
        <div class="summary-row"><span>Livrare estimată</span><strong data-cart-shipping>$0.00</strong></div>
        <div class="summary-row summary-row--total"><span>Total</span><strong data-cart-total>$0.00</strong></div>
        <button class="button button--primary button--full" data-checkout type="button">Checkout</button>
        <p class="form-note">Plăţi sigură gestionată de Stripe Checkout.</p>
      </aside>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
