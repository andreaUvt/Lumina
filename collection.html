<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colecție | Lumina Cu Tine</title>
  <meta name="description" content="Cumpărați colecția completă Lumina Cu Tine de coliere și brățări.">
  <meta property="og:title" content="Colecția Lumina Cu Tine">
  <meta property="og:description" content="Coliere și brățări realizate pentru eleganță modernă zilnică.">
  <meta property="og:image" content="assets/images/category-necklaces.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/collection.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="collection" data-category="all">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="collection-banner">
      <div>
        <p class="eyebrow">Colecția</p>
        <h1>Piese fine pentru fiecare ritm al zilei.</h1>
        <p>Explorează coliere și brățări realizate cu materiale premium, detalii sculpturale și strălucire discretă.</p>
      </div>
    </section>
    <section class="collection-shell" aria-label="Products">
      <button class="button button--filter" type="button" data-open-filters>Filtre</button>
      <aside class="filters" id="filters-panel" aria-label="Filtre de produs"></aside>
      <div class="collection-content">
        <div class="collection-toolbar">
          <p id="product-count" aria-live="polite"></p>
          <label>Sortare
            <select id="sort-select">
              <option value="newest">Cel mai nou</option>
              <option value="price-asc">Preț scăzut la ridicat</option>
              <option value="price-desc">Preț ridicat la scăzut</option>
              <option value="featured">Recomandate</option>
            </select>
          </label>
        </div>
        <div class="product-grid" id="product-grid" aria-live="polite"></div>
        <button class="button button--ghost load-more" id="load-more" type="button">Încarcă mai mult</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
